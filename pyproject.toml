[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
version = "0.1.0"
description = "Reproducible flow matching for chemical and genetic single-cell perturbations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<2", "scipy>=1.9", "pandas>=1.5", "torch>=2.1", "POT>=0.9"]

[project.scripts]
devflow = "devflow.cli:main"
devflow-preprocess = "preprocessing.__main__:main"

[project.optional-dependencies]
data = ["anndata>=0.10", "h5py>=3.8", "rdkit>=2023.9", "scikit-learn>=1.1.3"]
monitor = ["matplotlib>=3.7", "nbformat>=5.9", "nbclient>=0.9", "fastjsonschema==2.19.1; python_version < '3.10'"]
preprocess = ["scanpy==1.9.8", "scikit-misc==0.2.0", "omegaconf==2.3.0", "safetensors==0.4.3", "tqdm==4.66.4", "torchdiffeq==0.2.5", "lightning==2.3.3", "pytorch-lightning==1.9.5", "torchmetrics==1.5.2", "datasets==2.21.0", "pyarrow==17.0.0", "huggingface-hub==0.24.0", "fsspec==2024.6.1"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["devflow*", "recipes*", "benchmark*", "preprocessing*"]

[tool.setuptools.package-data]
"benchmark.protocols" = ["*.json"]
"preprocessing" = ["**/*.json", "**/*.yaml", "**/LICENSE*", "**/NOTICE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
